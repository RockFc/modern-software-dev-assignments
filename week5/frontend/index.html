<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modern Software Dev Starter</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Modern Software Dev Starter</h1>

      <section>
        <h2>Notes</h2>
        <form id="note-form">
          <input id="note-title" placeholder="Title" required />
          <input id="note-content" placeholder="Content" required />
          <button type="submit">Add</button>
        </form>
        <div class="toolbar">
          <input id="note-search" placeholder="Search notes..." />
          <select id="note-sort">
            <option value="created_desc">Newest first</option>
            <option value="title_asc">Title A-Z</option>
          </select>
          <button type="button" id="note-search-btn">Search</button>
          <button type="button" id="note-clear-search">Clear</button>
        </div>
        <p id="notes-meta" class="meta"></p>
        <ul id="notes"></ul>
        <div class="pager">
          <button type="button" id="notes-prev">Prev</button>
          <span id="notes-page-label"></span>
          <button type="button" id="notes-next">Next</button>
        </div>
      </section>

      <section>
        <h2>Action Items</h2>
        <form id="action-form">
          <input id="action-desc" placeholder="Description" required />
          <button type="submit">Add</button>
        </form>
        <p id="actions-meta" class="meta"></p>
        <ul id="actions"></ul>
        <div class="pager">
          <button type="button" id="actions-prev">Prev</button>
          <span id="actions-page-label"></span>
          <button type="button" id="actions-next">Next</button>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
